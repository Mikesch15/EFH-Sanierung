<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanierungs- und Dokumentenverwaltung</title>
<style>
:root{
  --blau-900:#0C2742; --blau-800:#103454; --blau-700:#13527F; --blau-600:#1A6AA6;
  --blau-100:#DCE9F4; --blau-50:#EEF4FA;
  --bg:#F1F4F7; --karte:#FFFFFF; --linie:#DAE1E9; --linie-stark:#C3CDD9;
  --text:#152230; --text-2:#3D4F61; --grau:#67788A;
  --gruen:#186B44; --gruen-bg:#E4F2EA;
  --rot:#A72218; --rot-bg:#FBE9E7;
  --amber:#8A5A00; --amber-bg:#FBF0DC;
  --r:12px; --r-s:8px;
  --schatten:0 1px 2px rgba(15,35,55,.06), 0 2px 8px rgba(15,35,55,.05);
  --kopf-h:56px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.zahl{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.01em}
h2{font-size:1.05rem}
h3{font-size:.95rem}
button{font:inherit; color:inherit}
a{color:var(--blau-700)}

/* ---------- Kopf ---------- */
.kopf{
  position:sticky; top:0; z-index:40;
  background:var(--blau-900); color:#fff;
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 0 rgba(0,0,0,.15);
}
.kopf-inner{max-width:1100px; margin:0 auto; padding:0 14px; height:var(--kopf-h);
  display:flex; align-items:center; gap:14px; justify-content:space-between}
.marke{display:flex; align-items:baseline; gap:9px; min-width:0}
.marke b{font-size:1rem; font-weight:650; letter-spacing:-.01em; white-space:nowrap}
.marke span{font-size:.75rem; color:#9FBBD4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tabs-desktop{display:none; gap:2px}
.tabs-desktop button{
  background:none; border:0; color:#B9CFE3; padding:8px 13px; border-radius:var(--r-s);
  cursor:pointer; font-size:.9rem; font-weight:550;
}
.tabs-desktop button:hover{background:rgba(255,255,255,.08); color:#fff}
.tabs-desktop button[aria-current="page"]{background:var(--blau-700); color:#fff}

/* ---------- Unten-Navigation (mobil) ---------- */
.tabs-mobil{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:#fff; border-top:1px solid var(--linie);
  display:grid; grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs-mobil button{
  background:none; border:0; cursor:pointer; padding:9px 2px 8px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:.68rem; color:var(--grau); font-weight:550; min-height:58px;
}
.tabs-mobil svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.tabs-mobil button[aria-current="page"]{color:var(--blau-700)}

/* ---------- Layout ---------- */
main{max-width:1100px; margin:0 auto; padding:14px 12px 24px}
.abschnitt{margin-bottom:18px}
.abschnitt-kopf{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 2px 9px}
.abschnitt-kopf p{margin:2px 0 0; font-size:.8rem; color:var(--grau)}
.karte{background:var(--karte); border:1px solid var(--linie); border-radius:var(--r); box-shadow:var(--schatten)}
.karte-pad{padding:14px}

/* ---------- Kennzahlen ---------- */
.kpi-raster{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.kpi{background:var(--karte); border:1px solid var(--linie); border-radius:var(--r); padding:12px 13px; box-shadow:var(--schatten)}
.kpi .label{font-size:.76rem; color:var(--grau); font-weight:550; margin-bottom:5px}
.kpi .wert{font-size:1.22rem; font-weight:660; letter-spacing:-.02em; white-space:nowrap}
.kpi .zusatz{font-size:.72rem; color:var(--grau); margin-top:3px}
.kpi.gross{grid-column:1 / -1; background:var(--blau-800); border-color:var(--blau-800); color:#fff}
.kpi.gross .label{color:#A8C6E0}
.kpi.gross .wert{font-size:1.6rem}
.kpi.gross .zusatz{color:#A8C6E0}
.kpi.rand-gruen{border-left:3px solid var(--gruen)}
.kpi.rand-blau{border-left:3px solid var(--blau-600)}
.kpi.rand-amber{border-left:3px solid var(--amber)}
.pos{color:var(--gruen)} .neg{color:var(--rot)}

/* ---------- Fortschritt ---------- */
.balken{height:22px; background:var(--blau-50); border-radius:6px; overflow:hidden; display:flex; border:1px solid var(--linie)}
.balken i{display:block; height:100%}
.balken .b-bezahlt{background:var(--blau-700)}
.balken .b-offen{background:var(--blau-600); opacity:.45}
.balken .b-verpflichtet{background:repeating-linear-gradient(135deg,#C9D9E7 0 5px,#DEE8F1 5px 10px)}
.legende{display:flex; flex-wrap:wrap; gap:12px; margin-top:9px; font-size:.78rem; color:var(--text-2)}
.legende span{display:flex; align-items:center; gap:6px}
.punkt{width:10px; height:10px; border-radius:3px; display:inline-block}

/* ---------- Kategoriebalken ---------- */
.kat-zeile{padding:9px 0; border-bottom:1px solid var(--linie)}
.kat-zeile:last-child{border-bottom:0}
.kat-kopf{display:flex; justify-content:space-between; gap:10px; font-size:.86rem; margin-bottom:6px}
.kat-kopf b{font-weight:600}
.mini{height:8px; background:var(--blau-50); border-radius:4px; overflow:hidden}
.mini i{display:block; height:100%; background:var(--blau-600)}
.mini i.ueber{background:var(--rot)}

/* ---------- Tabellen ---------- */
.tab-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:.87rem}
th,td{padding:10px 11px; text-align:left; border-bottom:1px solid var(--linie); white-space:nowrap}
th{font-size:.74rem; color:var(--grau); font-weight:600; background:#F7F9FB; position:sticky; top:0}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:650; background:#F7F9FB; border-top:2px solid var(--linie-stark)}
.zeile-aktion{display:flex; gap:6px; justify-content:flex-end}

/* ---------- Listen ---------- */
.liste{list-style:none; margin:0; padding:0}
.liste li{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--linie)}
.liste li:last-child{border-bottom:0}
.liste .haupt{flex:1; min-width:0}
.liste .titel{font-weight:600; font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.liste .unter{font-size:.78rem; color:var(--grau); margin-top:2px}
.liste .betrag{font-weight:650; white-space:nowrap; font-variant-numeric:tabular-nums}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  background:var(--blau-700); color:#fff; border:1px solid var(--blau-700);
  padding:11px 16px; border-radius:var(--r-s); font-weight:600; font-size:.9rem;
  cursor:pointer; min-height:44px; text-decoration:none;
}
.btn:hover{background:var(--blau-800); border-color:var(--blau-800)}
.btn.zweit{background:#fff; color:var(--blau-700); border-color:var(--linie-stark)}
.btn.zweit:hover{background:var(--blau-50); border-color:var(--blau-600)}
.btn.still{background:transparent; color:var(--text-2); border-color:transparent; padding:8px 10px; min-height:38px}
.btn.still:hover{background:#EDF1F5}
.btn.gefahr{background:#fff; color:var(--rot); border-color:#E8C5C1}
.btn.gefahr:hover{background:var(--rot-bg)}
.btn.klein{padding:7px 11px; min-height:36px; font-size:.82rem}
.btn.breit{width:100%}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn-reihe{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- Abzeichen ---------- */
.badge{display:inline-block; font-size:.7rem; font-weight:650; padding:3px 8px; border-radius:20px;
  background:#EDF1F5; color:var(--text-2); white-space:nowrap; vertical-align:middle}
.badge.blau{background:var(--blau-100); color:var(--blau-700)}
.badge.gruen{background:var(--gruen-bg); color:var(--gruen)}
.badge.rot{background:var(--rot-bg); color:var(--rot)}
.badge.amber{background:var(--amber-bg); color:var(--amber)}
.badge.demo{background:#F0E6F7; color:#6B2E8F}

/* ---------- Hinweise ---------- */
.hinweis{border-radius:var(--r-s); padding:11px 13px; font-size:.83rem; display:flex; gap:9px; align-items:flex-start}
.hinweis.demo{background:#F6EEFB; color:#5A2679; border:1px solid #E2CDEE}
.hinweis.warn{background:var(--amber-bg); color:var(--amber); border:1px solid #EBD5A8}
.hinweis.fehler{background:var(--rot-bg); color:var(--rot); border:1px solid #EFC7C2}
.hinweis.info{background:var(--blau-50); color:var(--blau-800); border:1px solid var(--blau-100)}
.hinweis b{display:block; margin-bottom:2px}
.leer{text-align:center; padding:26px 16px; color:var(--grau); font-size:.87rem}
.leer b{display:block; color:var(--text); font-size:.95rem; margin-bottom:4px}

/* ---------- Formulare ---------- */
label.feld{display:block; margin-bottom:12px}
label.feld > span{display:block; font-size:.78rem; font-weight:600; color:var(--text-2); margin-bottom:5px}
input,select,textarea{
  width:100%; padding:11px 12px; border:1px solid var(--linie-stark); border-radius:var(--r-s);
  background:#fff; font:inherit; font-size:16px; color:var(--text); min-height:44px;
}
textarea{min-height:76px; resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blau-600); outline-offset:1px}
input[type=checkbox]{width:20px; height:20px; min-height:0; accent-color:var(--blau-700)}
.feld-paar{display:grid; grid-template-columns:1fr 1fr; gap:0 10px}
.check{display:flex; align-items:center; gap:9px; margin-bottom:12px; font-size:.9rem; font-weight:550}
.datei-feld{border:1.5px dashed var(--linie-stark); border-radius:var(--r-s); padding:14px; text-align:center; background:var(--blau-50)}
.datei-feld input{border:0; background:none; padding:0; min-height:0; font-size:.85rem}
.datei-feld p{margin:0 0 9px; font-size:.83rem; color:var(--text-2)}

/* ---------- Positionszeilen ---------- */
.pos-liste{display:flex; flex-direction:column; gap:9px}
.pos-zeile{border:1px solid var(--linie); border-radius:var(--r-s); padding:10px; background:#FBFCFD}
.pos-grid{display:grid; grid-template-columns:1fr; gap:8px}
.pos-grid .p-nr{width:64px}
.pos-mini{display:grid; grid-template-columns:72px 1fr 1fr; gap:8px}
.pos-zeile label{margin:0}
.pos-fuss{display:flex; justify-content:space-between; align-items:center; margin-top:9px; font-size:.84rem}
.pos-fuss b{font-variant-numeric:tabular-nums}
.summe-box{border-top:2px solid var(--linie-stark); margin-top:12px; padding-top:11px}
.summe-zeile{display:flex; justify-content:space-between; padding:4px 0; font-size:.9rem}
.summe-zeile.total{font-size:1.05rem; font-weight:660; border-top:1px solid var(--linie); margin-top:5px; padding-top:8px}
.summe-zeile b{font-variant-numeric:tabular-nums}

/* ---------- Modal ---------- */
.modal-hg{position:fixed; inset:0; background:rgba(12,30,48,.5); z-index:60; display:flex;
  align-items:flex-end; justify-content:center; overflow-y:auto; padding:0}
.modal{background:#fff; width:100%; max-width:620px; border-radius:16px 16px 0 0; max-height:94vh;
  display:flex; flex-direction:column; animation:hoch .18s ease-out}
@keyframes hoch{from{transform:translateY(22px); opacity:.6} to{transform:none; opacity:1}}
.modal-kopf{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 16px; border-bottom:1px solid var(--linie); position:sticky; top:0; background:#fff; border-radius:16px 16px 0 0}
.modal-koerper{padding:16px; overflow-y:auto; flex:1}
.modal-fuss{padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--linie);
  display:flex; gap:9px; background:#fff}
.modal-fuss .btn{flex:1}
.x-btn{background:none; border:0; font-size:1.5rem; line-height:1; color:var(--grau); cursor:pointer; padding:4px 8px}

/* ---------- Meldung ---------- */
#meldung{position:fixed; left:12px; right:12px; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:70;
  display:flex; flex-direction:column; gap:8px; pointer-events:none}
.toast{background:var(--blau-900); color:#fff; padding:12px 14px; border-radius:var(--r-s); font-size:.86rem;
  box-shadow:0 6px 20px rgba(10,25,40,.28); max-width:520px; margin:0 auto; width:100%}
.toast.fehler{background:var(--rot)}

/* ---------- Analyse-Ladeanzeige ---------- */
.lade{padding:22px 16px; text-align:center}
.lade-ring{width:34px; height:34px; margin:0 auto 12px; border:3px solid var(--blau-100);
  border-top-color:var(--blau-700); border-radius:50%; animation:dreh .8s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
.lade-schritte{list-style:none; margin:12px auto 0; padding:0; max-width:290px; text-align:left; font-size:.85rem}
.lade-schritte li{padding:5px 0; color:var(--grau); display:flex; gap:9px}
.lade-schritte li.fertig{color:var(--text)}
.lade-schritte li.fertig::before{content:"✓"; color:var(--gruen); font-weight:700}
.lade-schritte li::before{content:"·"; width:12px; text-align:center}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
@media (min-width:760px){
  body{padding-bottom:20px}
  .tabs-mobil{display:none}
  .tabs-desktop{display:flex}
  .marke span{display:inline}
  main{padding:20px 16px 40px}
  .kpi-raster{grid-template-columns:repeat(3,1fr); gap:11px}
  .kpi.gross{grid-column:span 3}
  .kpi .wert{font-size:1.32rem}
  .pos-grid{grid-template-columns:70px 1fr 90px 100px 130px 44px; align-items:end}
  .pos-mini{display:contents}
  .modal-hg{align-items:center; padding:20px}
  .modal{border-radius:14px; max-height:88vh}
  .modal-kopf{border-radius:14px 14px 0 0}
  .zwei-spalten{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
}
</style>
</head>
<body>
<header class="kopf">
  <div class="kopf-inner">
    <div class="marke"><b id="kopf-titel">Projekt einrichten</b><span id="kopf-unter">Sanierung &amp; Dokumente</span></div>
    <nav class="tabs-desktop" id="nav-desktop"></nav>
  </div>
</header>

<main id="ansicht" tabindex="-1"></main>

<nav class="tabs-mobil" id="nav-mobil"></nav>
<div id="modal-wrap"></div>
<div id="meldung" aria-live="polite"></div>

<script>
"use strict";
/* =========================================================================
   Tulpenweg 37 – Sanierungs- und Dokumentenverwaltung
   Prototyp: eine einzige HTML-Datei, ohne Server, ohne externe Bibliotheken.
   Datenhaltung: localStorage (Datensätze) + IndexedDB (hochgeladene Dateien).
   ========================================================================= */

const SPEICHER_SCHLUESSEL = "tulpenweg37.prototyp.v1";
const MWST_SATZ = 8.1;            // Schweizer Normalsatz
const EINHEITEN = ["pauschal","Stk","m²","m","lfm","h","Tag","kg","Pos"];
const STATUS_LISTE = ["Entwurf","Erfasst","Verglichen","Beauftragt","Abgelehnt"];
const DOKUMENT_TYPEN = ["Kaufvertrag","Reservationsvereinbarung","Grundriss","Plan","Baubewilligung",
  "Handwerkerunterlagen","Garantie","Foto","Versicherungsunterlagen","Sonstiges"];
const STANDARD_KATEGORIEN = ["Rückbau / Entsorgung","Elektro","Wasser / Sanitär",
  "Maurerarbeiten / Wanddurchbrüche","Wände / Decken","Böden","Küche","Badezimmer EG",
  "Badezimmer OG","Fassade","Heizung","Fenster","Sonstiges","Reserve"];

/* ---------------- Hilfsfunktionen ---------------- */
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const id_neu = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/** Zahl als Schweizer Franken, z.B. CHF 18'450.00 */
function chf(n, mitWaehrung = true){
  const z = Number.isFinite(+n) ? +n : 0;
  const neg = z < 0;
  const t = Math.abs(z).toFixed(2).split(".");
  t[0] = t[0].replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  return (neg ? "−" : "") + (mitWaehrung ? "CHF " : "") + t[0] + "." + t[1];
}
/** kompakt fürs Dashboard, z.B. CHF 18'450.– */
function chfKurz(n){
  const z = Number.isFinite(+n) ? +n : 0;
  const neg = z < 0;
  let t = Math.round(Math.abs(z)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  return (neg ? "−" : "") + "CHF " + t + ".–";
}
/** "2026-09-19" -> "19.09.2026" */
function datumCH(iso){
  if(!iso) return "–";
  const t = String(iso).split("-");
  if(t.length !== 3) return iso;
  return t[2] + "." + t[1] + "." + t[0];
}
function heuteISO(){
  const d = new Date();
  const p = (n) => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
/** akzeptiert "1'500.50", "1500,50", "1 500" */
function zahl(v){
  if(typeof v === "number") return Number.isFinite(v) ? v : 0;
  if(v == null) return 0;
  const s = String(v).replace(/['\s’]/g,"").replace(",",".").replace(/[^0-9.\-]/g,"");
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}
function meldung(text, fehler){
  const box = el("meldung");
  const d = document.createElement("div");
  d.className = "toast" + (fehler ? " fehler" : "");
  d.textContent = text;
  box.appendChild(d);
  setTimeout(() => { d.remove(); }, fehler ? 6000 : 3200);
}

/* ---------------- Dateispeicher (IndexedDB mit Rückfallebene) ---------------- */
const Dateien = (function(){
  const sitzung = new Map();          // Rückfallebene: nur aktuelle Sitzung
  let dbVersprechen = null;
  let idbDefekt = false;

  function oeffnen(){
    if(idbDefekt) return Promise.reject(new Error("IndexedDB nicht verfügbar"));
    if(dbVersprechen) return dbVersprechen;
    dbVersprechen = new Promise((ok, fehler) => {
      let anfrage;
      try { anfrage = indexedDB.open("tulpenweg37", 1); }
      catch(e){ return fehler(e); }
      anfrage.onupgradeneeded = () => {
        const db = anfrage.result;
        if(!db.objectStoreNames.contains("dateien")) db.createObjectStore("dateien");
      };
      anfrage.onsuccess = () => ok(anfrage.result);
      anfrage.onerror   = () => fehler(anfrage.error || new Error("IndexedDB-Fehler"));
      anfrage.onblocked = () => fehler(new Error("IndexedDB blockiert"));
      setTimeout(() => fehler(new Error("IndexedDB-Zeitüberschreitung")), 4000);
    }).catch((e) => { idbDefekt = true; dbVersprechen = null; throw e; });
    return dbVersprechen;
  }

  async function speichern(datei){
    if(!datei) return null;
    const eintrag = {
      id: id_neu(), name: datei.name, typ: datei.type || "",
      groesse: datei.size, blob: datei, ablage: "idb"
    };
    try{
      const db = await oeffnen();
      await new Promise((ok, fehler) => {
        const t = db.transaction("dateien","readwrite");
        t.objectStore("dateien").put({name:eintrag.name, typ:eintrag.typ, groesse:eintrag.groesse, blob:datei}, eintrag.id);
        t.oncomplete = ok;
        t.onerror = () => fehler(t.error);
        t.onabort = () => fehler(t.error || new Error("Transaktion abgebrochen"));
      });
    }catch(e){
      eintrag.ablage = "sitzung";
      sitzung.set(eintrag.id, datei);
    }
    return { id: eintrag.id, name: eintrag.name, typ: eintrag.typ, groesse: eintrag.groesse, ablage: eintrag.ablage };
  }

  async function holen(dateiId){
    if(!dateiId) return null;
    if(sitzung.has(dateiId)) return sitzung.get(dateiId);
    try{
      const db = await oeffnen();
      const wert = await new Promise((ok, fehler) => {
        const t = db.transaction("dateien","readonly");
        const a = t.objectStore("dateien").get(dateiId);
        a.onsuccess = () => ok(a.result);
        a.onerror = () => fehler(a.error);
      });
      return wert ? wert.blob : null;
    }catch(e){ return null; }
  }

  async function loeschen(dateiId){
    if(!dateiId) return;
    sitzung.delete(dateiId);
    try{
      const db = await oeffnen();
      await new Promise((ok) => {
        const t = db.transaction("dateien","readwrite");
        t.objectStore("dateien").delete(dateiId);
        t.oncomplete = ok; t.onerror = ok; t.onabort = ok;
      });
    }catch(e){ /* nichts zu tun */ }
  }

  async function oeffnenImTab(dateiId, name){
    const blob = await holen(dateiId);
    if(!blob){
      meldung("Diese Datei ist nicht mehr gespeichert (Browser hat keinen Dateispeicher erlaubt).", true);
      return;
    }
    const url = URL.createObjectURL(blob);
    const w = window.open(url, "_blank");
    if(!w) meldung("Der Browser hat das Öffnen blockiert. Bitte Pop-ups erlauben.", true);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  return { speichern, holen, loeschen, oeffnenImTab };
})();

/* ---------------- Zustand ---------------- */
let S = leererZustand();
let speicherFehler = "";

function leererZustand(){
  return {
    eckdaten: { objekt: "", adresse: "", kaufpreis: 0, gesamtbudget: 0, demo: false },
    budget: [], offerten: [], belege: [], dokumente: []
  };
}

function laden(){
  try{
    const roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
    if(!roh) return;
    const d = JSON.parse(roh);
    S = Object.assign(leererZustand(), d);
    S.eckdaten = Object.assign(leererZustand().eckdaten, d.eckdaten || {});
    ["budget","offerten","belege","dokumente"].forEach(k => { if(!Array.isArray(S[k])) S[k] = []; });
  }catch(e){
    speicherFehler = "Gespeicherte Daten konnten nicht gelesen werden: " + e.message;
    S = leererZustand();
  }
}

function sichern(){
  try{
    localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(S));
    speicherFehler = "";
  }catch(e){
    speicherFehler = "Speichern fehlgeschlagen: " + e.message +
      " – Änderungen gehen beim Neuladen verloren.";
    meldung(speicherFehler, true);
  }
}
function sichernUndZeichnen(){ sichern(); zeichnen(); }

/* ---------------- Berechnungen ---------------- */
function offerteNetto(o){
  return (o.positionen || []).reduce((s,p) => s + zahl(p.menge) * zahl(p.preis), 0);
}
function offerteMwst(o){ return offerteNetto(o) * (zahl(o.mwstSatz || MWST_SATZ) / 100); }
function offerteTotal(o){ return offerteNetto(o) + offerteMwst(o); }
function offerteZaehlt(o){ return o.status !== "Abgelehnt"; }

function belegBrutto(b){
  const brutto = zahl(b.brutto);
  return brutto > 0 ? brutto : zahl(b.netto) + zahl(b.mwst);
}

function kategorien(){
  const menge = new Set();
  S.budget.forEach(p => { if(p.kategorie) menge.add(p.kategorie); });
  S.offerten.forEach(o => { if(o.kategorie) menge.add(o.kategorie); });
  S.belege.forEach(b => { if(b.kategorie) menge.add(b.kategorie); });
  const liste = Array.from(menge);
  STANDARD_KATEGORIEN.forEach(k => { if(!menge.has(k)) liste.push(k); });
  return liste;
}

/** Summen pro Kategorie – Grundlage für Budget-Tabelle und Kostenvergleich */
function kategorieUebersicht(){
  const karte = new Map();
  const hol = (k) => {
    const name = k || "Nicht zugeordnet";
    if(!karte.has(name)) karte.set(name, { kategorie:name, budget:0, offerte:0, rechnung:0, bezahlt:0 });
    return karte.get(name);
  };
  S.budget.forEach(p => { hol(p.kategorie).budget += zahl(p.betrag); });
  S.offerten.forEach(o => { if(offerteZaehlt(o)) hol(o.kategorie).offerte += offerteTotal(o); });
  S.belege.forEach(b => {
    const z = hol(b.kategorie);
    const betrag = belegBrutto(b);
    z.rechnung += betrag;
    if(b.bezahlt) z.bezahlt += betrag;
  });
  const liste = Array.from(karte.values());
  liste.forEach(z => {
    z.ist = z.rechnung > 0 ? z.rechnung : z.offerte;   // Rechnung schlägt Offerte
    z.differenz = z.budget - z.ist;
  });
  liste.sort((a,b) => (b.budget + b.ist) - (a.budget + a.ist) || a.kategorie.localeCompare(b.kategorie,"de"));
  return liste;
}

/** offener Betrag aus beauftragten Offerten, für die noch keine Rechnung erfasst ist */
function verpflichtetOffen(){
  let offen = 0;
  S.offerten.filter(o => o.status === "Beauftragt").forEach(o => {
    const verrechnet = S.belege.filter(b => b.offerteId === o.id)
      .reduce((s,b) => s + belegBrutto(b), 0);
    offen += Math.max(0, offerteTotal(o) - verrechnet);
  });
  return offen;
}

function summen(){
  const gesamtbudget = zahl(S.eckdaten.gesamtbudget);
  const kaufpreis = zahl(S.eckdaten.kaufpreis);
  const rahmen = gesamtbudget - kaufpreis;
  const budgetiert = S.budget.reduce((s,p) => s + zahl(p.betrag), 0);
  const offerten = S.offerten.filter(offerteZaehlt).reduce((s,o) => s + offerteTotal(o), 0);
  const rechnungen = S.belege.reduce((s,b) => s + belegBrutto(b), 0);
  const bezahlt = S.belege.filter(b => b.bezahlt).reduce((s,b) => s + belegBrutto(b), 0);
  const verpflichtet = verpflichtetOffen();
  return {
    gesamtbudget, kaufpreis, rahmen, budgetiert, offerten, rechnungen, bezahlt, verpflichtet,
    offen: rechnungen - bezahlt,
    verfuegbar: rahmen - rechnungen - verpflichtet
  };
}

/* =========================== 1. ÜBERSICHT =========================== */
function uebersichtHtml(){
  const s = summen();
  const leerAlles = !S.budget.length && !S.offerten.length && !S.belege.length && !S.dokumente.length;

  let h = "";

  const nichtEingerichtet = !S.eckdaten.objekt && !s.gesamtbudget && !s.kaufpreis;

    h += '<section class="abschnitt"><div class="karte karte-pad">' +
      '<h2>Projekt einrichten</h2>' +
      '<p style="margin:6px 0 13px;font-size:.87rem;color:var(--text-2)">' +
        'Objekt, Adresse, Kaufpreis und Gesamtbudget sind noch nicht erfasst. Alle Kennzahlen bleiben bei null, ' +
        'bis Sie die Eckdaten eintragen.</p>' +
      '<div class="btn-reihe"><button class="btn" type="button" data-aktion="eckdaten">Eckdaten erfassen</button>' +
      '<button class="btn zweit" type="button" data-aktion="demo-laden">Mit Demo-Daten ansehen</button></div>' +
      '</div></section>';

    h += '<div class="abschnitt hinweis info"><div><b>Noch keine Daten erfasst</b>' +
      'Legen Sie Budgetpositionen an, erfassen Sie Offerten, Belege und Dokumente.</div></div>';
  }

  /* Kennzahlen */
  const anteilRahmen = s.rahmen > 0 ? Math.min(100, (s.rechnungen / s.rahmen) * 100) : 0;
  h += '<section class="abschnitt">' +
    '<div class="abschnitt-kopf"><div><h2>Übersicht</h2>' +
      '<p>' + esc([S.eckdaten.objekt, S.eckdaten.adresse].filter(Boolean).join(" · ") || "Projekt ohne Namen") +
        ' · Stand ' + datumCH(heuteISO()) + '</p></div>' +
      '<button class="btn still klein" type="button" data-aktion="eckdaten">Eckdaten</button></div>' +
    '<div class="kpi-raster">' +
      '<div class="kpi gross"><div class="label">Verfügbar für die Sanierung</div>' +
        '<div class="wert zahl">' + chfKurz(s.verfuegbar) + '</div>' +
        '<div class="zusatz">Sanierungsrahmen ' + chfKurz(s.rahmen) + ' abzüglich Rechnungen und beauftragter Offerten</div></div>' +
      kpi("Gesamtbudget", chfKurz(s.gesamtbudget), "inkl. Kaufpreis und Nebenkosten", "") +
      kpi("Kaufpreis", chfKurz(s.kaufpreis), "aktueller Stand", "") +
      kpi("Sanierungsrahmen", chfKurz(s.rahmen), "Gesamtbudget − Kaufpreis", "rand-blau") +
      kpi("Offertsumme", chfKurz(s.offerten), S.offerten.length + " Offerten, ohne abgelehnte", "rand-blau") +
      kpi("Rechnungssumme", chfKurz(s.rechnungen), S.belege.length + " Belege, inkl. MWST", "rand-amber") +
      kpi("Bezahlt", chfKurz(s.bezahlt), "offen: " + chfKurz(s.offen), "rand-gruen") +
    '</div></section>';

  /* Fortschrittsbalken */
  const b1 = s.rahmen > 0 ? Math.max(0, Math.min(100, s.bezahlt / s.rahmen * 100)) : 0;
  const b2 = s.rahmen > 0 ? Math.max(0, Math.min(100 - b1, (s.rechnungen - s.bezahlt) / s.rahmen * 100)) : 0;
  const b3 = s.rahmen > 0 ? Math.max(0, Math.min(100 - b1 - b2, s.verpflichtet / s.rahmen * 100)) : 0;
  h += '<section class="abschnitt"><div class="karte karte-pad">' +
    '<div class="abschnitt-kopf" style="margin-left:0;margin-right:0"><div><h3>Sanierungsbudget</h3>' +
      '<p>' + Math.round(anteilRahmen) + '\u2009% des Rahmens sind verrechnet</p></div>' +
      '<div class="zahl" style="font-weight:650">' + chfKurz(s.rechnungen) + ' / ' + chfKurz(s.rahmen) + '</div></div>' +
    '<div class="balken">' +
      '<i class="b-bezahlt" style="width:' + b1.toFixed(2) + '%"></i>' +
      '<i class="b-offen" style="width:' + b2.toFixed(2) + '%"></i>' +
      '<i class="b-verpflichtet" style="width:' + b3.toFixed(2) + '%"></i>' +
    '</div>' +
    '<div class="legende">' +
      '<span><i class="punkt" style="background:var(--blau-700)"></i>bezahlt ' + chfKurz(s.bezahlt) + '</span>' +
      '<span><i class="punkt" style="background:#8FB6D4"></i>Rechnungen offen ' + chfKurz(s.offen) + '</span>' +
      '<span><i class="punkt" style="background:#D3DFEA"></i>beauftragt, noch ohne Rechnung ' + chfKurz(s.verpflichtet) + '</span>' +
    '</div>' +

    '</div></section>';

  /* Kosten nach Kategorien */
  const kats = kategorieUebersicht().filter(k => k.budget > 0 || k.ist > 0).slice(0,8);

    });

  h += '</div></section>';

  /* Letzte Einträge */
  h += '<div class="zwei-spalten">';

  h += listenKarte("Letzte Belege", "belege", S.belege.slice().reverse().slice(0,4).map(b => ({

    betrag: chfKurz(belegBrutto(b)),

  })));
  h += '</div>';

  h += listenKarte("Letzte Dokumente", "dokumente", S.dokumente.slice().reverse().slice(0,5).map(d => ({
    titel: d.dateiname || "Ohne Namen",
    unter: (d.typ || "Sonstiges") + " · " + datumCH(d.datum),
    betrag: "", badge: ""
  })));

  /* Daten übertragen */
  h += '<section class="abschnitt"><div class="karte karte-pad">' +
    '<h3>Daten sichern und auf ein anderes Gerät übertragen</h3>' +
    '<p style="margin:5px 0 12px;font-size:.84rem;color:var(--grau)">' +

      'zwischen Geräten – dafür braucht es später ein Konto und eine Datenbank. ' +
      'Bis dahin können Sie eine Sicherungsdatei exportieren und auf einem anderen Gerät einlesen. ' +

      '<button class="btn zweit" type="button" data-aktion="export">Daten exportieren</button>' +
      '<button class="btn zweit" type="button" data-aktion="import">Daten importieren</button>' +
    '</div></div></section>';

  /* Demo-Daten */
  h += '<section class="abschnitt"><div class="karte karte-pad">' +
    '<h3>Demo-Daten</h3>' +
    '<p style="margin:5px 0 12px;font-size:.84rem;color:var(--grau)">' +
      'Legt 5 Budgetpositionen, 2 Offerten, 3 Rechnungen und 3 Dokumente an, um den Prototyp auszuprobieren. ' +
      'Demo-Daten sind mit einem violetten Abzeichen gekennzeichnet.</p>' +
    '<div class="btn-reihe">' +
      '<button class="btn zweit" type="button" data-aktion="demo-laden">Demo-Daten laden</button>' +
      '<button class="btn gefahr" type="button" data-aktion="demo-loeschen">Demo-Daten löschen</button>' +
      '<button class="btn gefahr" type="button" data-aktion="alles-loeschen">Alle Daten löschen</button>' +
    '</div></div></section>';

  return h;
}

/* =========================== 2. BUDGET + 6. KOSTENVERGLEICH =========================== */
function budgetHtml(){

    '<p>Sanierungsrahmen ' + chfKurz(s.rahmen) + ' · verplant ' + chfKurz(s.budgetiert) + '</p></div>' +
    '<button class="btn klein" type="button" data-aktion="budget-neu">+ Position</button></div>';

  if(!S.budget.length){
    h += leerZustand("Noch keine Budgetpositionen",

      '<button class="btn" type="button" data-aktion="budget-neu">Erste Position anlegen</button>');
  } else {
    const uebersicht = kategorieUebersicht();

    h += '<div class="karte"><div class="tab-scroll"><table><thead><tr>' +

      '<th class="num">Rechnungen</th><th class="num">Bezahlt</th><th class="num">Differenz</th><th></th>' +
      '</tr></thead><tbody>';
    S.budget.forEach(p => {
      const z = holen(p.kategorie);
      const ist = z.rechnung > 0 ? z.rechnung : z.offerte;
      const diff = zahl(p.betrag) - ist;
      h += '<tr><td><b>' + esc(p.kategorie) + '</b>' +
        (p.bemerkung ? '<div style="font-size:.76rem;color:var(--grau);white-space:normal;max-width:260px">' + esc(p.bemerkung) + '</div>' : '') +
        '</td>' +
        '<td class="num">' + chf(p.betrag) + '</td>' +
        '<td class="num">' + chf(z.offerte) + '</td>' +
        '<td class="num">' + chf(z.rechnung) + '</td>' +
        '<td class="num">' + chf(z.bezahlt) + '</td>' +
        '<td class="num ' + (diff < 0 ? "neg" : "pos") + '">' + (diff >= 0 ? "+" : "") + chf(diff) + '</td>' +
        '<td><div class="zeile-aktion">' +
          '<button class="btn still klein" type="button" data-aktion="budget-bearbeiten" data-id="' + p.id + '">Bearbeiten</button>' +
          '<button class="btn still klein" type="button" data-aktion="budget-loeschen" data-id="' + p.id + '">Löschen</button>' +
        '</div></td></tr>';
    });
    const summeOff = S.budget.reduce((a,p) => a + holen(p.kategorie).offerte, 0);
    const summeRe  = S.budget.reduce((a,p) => a + holen(p.kategorie).rechnung, 0);
    const summeBez = S.budget.reduce((a,p) => a + holen(p.kategorie).bezahlt, 0);
    h += '</tbody><tfoot><tr><td>Total Budgetpositionen</td>' +
      '<td class="num">' + chf(s.budgetiert) + '</td>' +
      '<td class="num">' + chf(summeOff) + '</td>' +
      '<td class="num">' + chf(summeRe) + '</td>' +
      '<td class="num">' + chf(summeBez) + '</td>' +
      '<td class="num"></td><td></td></tr></tfoot></table></div></div>';
  }
  h += '</section>';

  /* Kostenvergleich */

/* Simulierte Analyse */
function offerteAnalysieren(){
  const dateiFeld = el("o-datei");
  if(dateiFeld && dateiFeld.files && dateiFeld.files[0]){
    const d = dateiFeld.files[0];
    const erlaubt = ["application/pdf","image/jpeg","image/png"];
    if(d.type && erlaubt.indexOf(d.type) === -1){
      meldung("Nur PDF, JPG oder PNG möglich. Gewählt: " + (d.type || "unbekannt"), true);
      return;
    }
    oDateiWartend = d;
  }
  if(!oDateiWartend && !oEntwurf.dateiInfo){
    meldung("Bitte zuerst eine Datei auswählen.", true);
    return;
  }
  const block = el("o-analyse");
  const schritte = ["Datei wird gelesen", "Dokument wird ausgewertet", "Positionen werden übernommen"];
  block.innerHTML = '<div class="karte karte-pad lade" style="margin-bottom:14px">' +
    '<div class="lade-ring"></div><b>Offerte wird analysiert …</b>' +
    '<ul class="lade-schritte">' + schritte.map((t,i) =>
      '<li id="lade-' + i + '">' + t + '</li>').join("") + '</ul>' +
    '<p style="margin:12px 0 0;font-size:.76rem;color:var(--grau)">Simulierter Ablauf – es wird keine Datei ausgelesen und keine Schnittstelle aufgerufen.</p></div>';

  let i = 0;
  const takt = setInterval(() => {
    const li = el("lade-" + i);
    if(li) li.classList.add("fertig");
    i++;
    if(i >= schritte.length){
      clearInterval(takt);
      setTimeout(demoErkennungUebernehmen, 450);
    }
  }, 550);
}

async function offerteSpeichern(){
  const o = oEntwurf;
  if(!o.lieferant.trim() && !o.nummer.trim()){
    meldung("Bitte mindestens Lieferant oder Offertnummer angeben.", true);
    return false;
  }
  o.positionen = o.positionen.filter(p => p.beschreibung.trim() || zahl(p.preis) !== 0);
  if(!o.positionen.length) o.positionen = [neueOffertePosition()];

  const dateiFeld = el("o-datei");
  if(!oDateiWartend && dateiFeld && dateiFeld.files && dateiFeld.files[0]) oDateiWartend = dateiFeld.files[0];
  if(oDateiWartend){
    const info = await Dateien.speichern(oDateiWartend);
    if(info){
      o.dateiInfo = info;
      if(info.ablage === "sitzung") meldung("Datei konnte nicht dauerhaft gespeichert werden – sie ist nur in dieser Sitzung verfügbar.", true);
    }
    oDateiWartend = null;
  }

  if(o.id){
    const i = S.offerten.findIndex(x => x.id === o.id);
    S.offerten[i] = o;
    meldung("Offerte aktualisiert.");
  } else {
    o.id = id_neu();
    S.offerten.push(o);
    meldung("Offerte gespeichert.");
  }
  sichernUndZeichnen();
  return true;
}

}

/** ergänzt das fehlende der drei Beträge */
function belegBetraegeAbgleichen(zuletzt){
  const b = bEntwurf;
  const f = 1 + MWST_SATZ/100;
  const r = (n) => Math.round(n * 100) / 100;
  if(zuletzt === "brutto"){
    b.netto = r(zahl(b.brutto) / f);
    b.mwst  = r(zahl(b.brutto) - zahl(b.netto));
  } else if(zuletzt === "netto"){
    if(!b._mwstManuell) b.mwst = r(zahl(b.netto) * MWST_SATZ/100);
    b.brutto = r(zahl(b.netto) + zahl(b.mwst));
  } else if(zuletzt === "mwst"){
    b.brutto = r(zahl(b.netto) + zahl(b.mwst));
  }
  document.querySelectorAll("[data-b-betrag]").forEach(inp => {
    const name = inp.dataset.feld;
    if(name !== zuletzt) inp.value = zahl(b[name]);
  });
}

async function belegSpeichern(){
  const b = bEntwurf;
  if(!b.lieferant.trim() && !b.nummer.trim()){
    meldung("Bitte mindestens Lieferant oder Rechnungsnummer angeben.", true); return false;
  }
  if(belegBrutto(b) <= 0){ meldung("Bitte einen Betrag erfassen.", true); return false; }
  delete b._mwstManuell;
  b.netto = zahl(b.netto); b.mwst = zahl(b.mwst); b.brutto = zahl(b.brutto);
  if(b.bezahlt && !b.zahlungsdatum) b.zahlungsdatum = heuteISO();
  if(!b.bezahlt) b.zahlungsdatum = "";

  const feld = el("b-datei");
  if(!bDateiWartend && feld && feld.files && feld.files[0]) bDateiWartend = feld.files[0];
  if(bDateiWartend){
    const info = await Dateien.speichern(bDateiWartend);
    if(info){
      b.dateiInfo = info;
      if(info.ablage === "sitzung") meldung("Datei nur in dieser Sitzung verfügbar.", true);
    }
    bDateiWartend = null;
  }

  if(b.id){
    S.belege[S.belege.findIndex(x => x.id === b.id)] = b;
    meldung("Beleg aktualisiert.");
  } else {
    b.id = id_neu(); S.belege.push(b); meldung("Beleg gespeichert.");
  }
  sichernUndZeichnen();
  return true;
}

function modalSchliessen(){
  el("modal-wrap").innerHTML = "";
  document.body.style.overflow = "";
  modalSpeichern = null;
  oEntwurf = null; bEntwurf = null; oDateiWartend = null; bDateiWartend = null;
}

async function modalSpeichernAusloesen(knopf){
  if(!modalSpeichern) return modalSchliessen();
  knopf.disabled = true;
  try{
    const fertig = await modalSpeichern();
    if(fertig !== false) modalSchliessen();
  }catch(e){
    meldung("Fehler beim Speichern: " + e.message, true);
  }finally{
    if(knopf) knopf.disabled = false;
  }
}

function demoDatenLoeschen(){
  const anzahl = ["budget","offerten","belege","dokumente"]
    .reduce((s,k) => s + S[k].filter(x => x.demo).length, 0);
  if(!anzahl && !S.eckdaten.demo){ meldung("Es sind keine Demo-Daten vorhanden.", true); return; }

  ["budget","offerten","belege","dokumente"].forEach(k => {
    S[k].filter(x => x.demo && x.dateiInfo).forEach(x => Dateien.loeschen(x.dateiInfo.id));
    S[k] = S[k].filter(x => !x.demo);
  });
  S.belege.forEach(b => { if(b.offerteId && !S.offerten.some(o => o.id === b.offerteId)) b.offerteId = ""; });
  if(S.eckdaten.demo) S.eckdaten = leererZustand().eckdaten;
  sichernUndZeichnen();
  meldung("Demo-Daten gelöscht.");
}

function allesLoeschen(){
  if(!bestaetigen("Wirklich alle Daten dieses Prototyps löschen? Das lässt sich nicht rückgängig machen.")) return;
  ["offerten","belege","dokumente"].forEach(k =>
    S[k].filter(x => x.dateiInfo).forEach(x => Dateien.loeschen(x.dateiInfo.id)));
  S = leererZustand();
  sichernUndZeichnen();
  meldung("Alle Daten gelöscht.");
}

/* =========================== Sicherung / Übertragung =========================== */
function datenExportieren(){
  try{
    const paket = { typ:"tulpenweg-sanierung", version:1, erstellt:new Date().toISOString(), daten:S };
    const blob = new Blob([JSON.stringify(paket, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "sanierung-" + heuteISO() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    meldung("Sicherungsdatei erstellt.");
  }catch(e){
    meldung("Export fehlgeschlagen: " + e.message, true);
  }
}

function datenImportieren(){
  modalOeffnen({
    titel: "Daten importieren",
    koerper:
      '<div class="hinweis warn" style="margin-bottom:14px"><div><b>Alle aktuellen Daten werden ersetzt</b>' +
        'Erstellen Sie vorher eine Sicherung, falls auf diesem Gerät bereits Daten erfasst sind.</div></div>' +
      '<div class="datei-feld"><p>Sicherungsdatei (.json) auswählen</p>' +
        '<input type="file" id="i-datei" accept=".json,application/json"></div>',
    speichern: async () => {
      const feld = el("i-datei");
      const datei = feld && feld.files ? feld.files[0] : null;
      if(!datei){ meldung("Bitte eine Sicherungsdatei auswählen.", true); return false; }
      let paket;
      try{
        paket = JSON.parse(await datei.text());
      }catch(e){
        meldung("Die Datei ist keine gültige Sicherung: " + e.message, true); return false;
      }
      const daten = paket && paket.daten ? paket.daten : paket;
      if(!daten || !Array.isArray(daten.budget) || !Array.isArray(daten.offerten)){
        meldung("Die Datei enthält keine Projektdaten dieses Prototyps.", true); return false;
      }
      S = Object.assign(leererZustand(), daten);
      S.eckdaten = Object.assign(leererZustand().eckdaten, daten.eckdaten || {});
      ["budget","offerten","belege","dokumente"].forEach(k => { if(!Array.isArray(S[k])) S[k] = []; });
      [].concat(S.offerten, S.belege, S.dokumente).forEach(x => { if(x && x.dateiInfo) x.dateiInfo = null; });
      sichernUndZeichnen();
      meldung("Daten importiert. Hochgeladene Dateien sind nicht Teil der Sicherung.");
      return true;
    }
  });
}

/* =========================== Ereignisse =========================== */
document.addEventListener("click", async (e) => {
  const knopf = e.target.closest("[data-aktion]");
  if(knopf){
    const a = knopf.dataset.aktion;
    const kid = knopf.dataset.id;

    if(a === "modal-zu") return modalSchliessen();
    if(a === "modal-speichern") return modalSpeichernAusloesen(knopf);
    if(a === "datei-oeffnen") return Dateien.oeffnenImTab(kid);
    if(a === "eckdaten") return eckdatenFormular();
    if(a === "export") return datenExportieren();
    if(a === "import") return datenImportieren();
    if(a === "demo-laden") return demoDatenLaden();
    if(a === "demo-loeschen") return demoDatenLoeschen();
    if(a === "alles-loeschen") return allesLoeschen();

    /* Budget */
    if(a === "budget-neu") return budgetFormular(null);
    if(a === "budget-bearbeiten") return budgetFormular(S.budget.find(p => p.id === kid));
    if(a === "budget-loeschen"){
      const p = S.budget.find(x => x.id === kid);
      if(p && bestaetigen('Budgetposition "' + p.kategorie + '" löschen?')){
        S.budget = S.budget.filter(x => x.id !== kid);
        sichernUndZeichnen(); meldung("Budgetposition gelöscht.");
      }
      return;
    }

    /* Offerten */
    if(a === "offerte-neu") return offerteFormular(null);
    if(a === "offerte-bearbeiten") return offerteFormular(S.offerten.find(o => o.id === kid));
    if(a === "offerte-loeschen"){
      const o = S.offerten.find(x => x.id === kid);
      if(o && bestaetigen("Offerte " + (o.nummer || o.lieferant || "") + " löschen?")){
        if(o.dateiInfo) Dateien.loeschen(o.dateiInfo.id);
        S.offerten = S.offerten.filter(x => x.id !== kid);
        S.belege.forEach(b => { if(b.offerteId === kid) b.offerteId = ""; });
        sichernUndZeichnen(); meldung("Offerte gelöscht.");
      }
      return;
    }
    if(a === "o-analysieren") return offerteAnalysieren();
    if(a === "o-pos-neu"){
      oEntwurf.positionen.push(neueOffertePosition());
      const letzte = oEntwurf.positionen.length - 1;
      oEntwurf.positionen[letzte].nr = String(letzte + 1);
      el("o-positionen").innerHTML = oEntwurf.positionen.map(offertePositionHtml).join("");
      offerteSummeAktualisieren();
      return;
    }
    if(a === "o-pos-weg"){
      const i = +knopf.dataset.pos;
      oEntwurf.positionen.splice(i,1);
      if(!oEntwurf.positionen.length) oEntwurf.positionen.push(neueOffertePosition());
      el("o-positionen").innerHTML = oEntwurf.positionen.map(offertePositionHtml).join("");
      offerteSummeAktualisieren();
      return;
    }
    if(a === "o-datei-entfernen"){
      if(oEntwurf.dateiInfo) Dateien.loeschen(oEntwurf.dateiInfo.id);
      oEntwurf.dateiInfo = null; oDateiWartend = null;
      el("o-analyse").innerHTML = offerteAnalyseBlock();
      return;
    }

    /* Belege */
    if(a === "beleg-neu") return belegFormular(null);
    if(a === "beleg-bearbeiten") return belegFormular(S.belege.find(b => b.id === kid));
    if(a === "beleg-loeschen"){
      const b = S.belege.find(x => x.id === kid);
      if(b && bestaetigen("Beleg " + (b.nummer || b.lieferant || "") + " löschen?")){
        if(b.dateiInfo) Dateien.loeschen(b.dateiInfo.id);
        S.belege = S.belege.filter(x => x.id !== kid);
        sichernUndZeichnen(); meldung("Beleg gelöscht.");
      }
      return;
    }
    if(a === "b-analysieren") return belegAnalysieren();
    if(a === "b-datei-entfernen"){
      if(bEntwurf.dateiInfo) Dateien.loeschen(bEntwurf.dateiInfo.id);
      bEntwurf.dateiInfo = null; bDateiWartend = null;
      el("b-analyse").innerHTML = belegAnalyseBlock();
      return;
    }

    /* Dokumente */
    if(a === "dokument-neu") return dokumenteHochladen();
    if(a === "dokument-bearbeiten") return dokumentFormular(S.dokumente.find(d => d.id === kid));
    if(a === "dokument-loeschen"){
      const d = S.dokumente.find(x => x.id === kid);
      if(d && bestaetigen('Dokument "' + d.dateiname + '" löschen?')){
        if(d.dateiInfo) Dateien.loeschen(d.dateiInfo.id);
        S.dokumente = S.dokumente.filter(x => x.id !== kid);
        sichernUndZeichnen(); meldung("Dokument gelöscht.");
      }
      return;
    }
    return;
  }
  if(e.target.id === "modal-hg") modalSchliessen();
});

document.addEventListener("input", (e) => {
  const feld = e.target.closest("[data-feld]");
  if(!feld) return;
  const name = feld.dataset.feld;
  const wert = feld.type === "checkbox" ? feld.checked : feld.value;

  if(oEntwurf && feld.dataset.pos !== undefined){
    const p = oEntwurf.positionen[+feld.dataset.pos];
    if(!p) return;
    p[name] = (name === "menge" || name === "preis") ? wert : wert;
    offerteSummeAktualisieren();
    return;
  }
  if(oEntwurf && document.querySelector(".modal")){
    oEntwurf[name] = wert;
    if(name === "mwstSatz") offerteSummeAktualisieren();
    return;
  }
  if(bEntwurf && document.querySelector(".modal")){
    bEntwurf[name] = wert;
    if(name === "mwst") bEntwurf._mwstManuell = true;
    if(feld.dataset.bBetrag) belegBetraegeAbgleichen(name);
    if(name === "bezahlt" && wert && !bEntwurf.zahlungsdatum){
      bEntwurf.zahlungsdatum = heuteISO();
      const zd = document.querySelector('[data-feld="zahlungsdatum"]');
      if(zd) zd.value = bEntwurf.zahlungsdatum;
    }
  }
});

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && el("modal-wrap").innerHTML) modalSchliessen();
});

window.addEventListener("error", (e) => {
  meldung("Unerwarteter Fehler: " + (e.message || "unbekannt"), true);
});

  const dl = document.createElement("datalist");

  dl.innerHTML = EINHEITEN.map(e => '<option value="' + e + '">').join("");

  try{ localStorage.setItem("tw-test","1"); localStorage.removeItem("tw-test"); }
  catch(e){ speicherFehler = "Der Browser erlaubt kein Speichern (localStorage gesperrt). Eingaben gehen beim Neuladen verloren."; }

  laden();
  zeichnen();
})();
</script>
