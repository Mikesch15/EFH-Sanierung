<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanierungs- und Dokumentenverwaltung</title>
<meta name="description" content="Budget, Offerten, Belege und Dokumente der Sanierung Tulpenweg 37.">
<link rel="stylesheet" href="css/stil.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C2742">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sanierung">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<header class="kopf" id="kopf">
  <div class="kopf-inner">
    <div class="marke"><b id="kopf-titel">Tulpenweg 37</b><span id="kopf-unter">Sanierung &amp; Dokumente</span></div>
    <nav class="tabs-desktop" id="nav-desktop"></nav>
  </div>
</header>

<div id="app">
  <noscript>
    <main><div class="karte karte-pad" style="margin:20px auto;max-width:520px">
      <div class="hinweis warn"><div><b>JavaScript ist ausgeschaltet</b>Die App braucht JavaScript.</div></div>
    </div></main>
  </noscript>
</div>

<nav class="tabs-mobil" id="nav-mobil" hidden></nav>
<div id="modal-wrap"></div>
<div id="meldung" aria-live="polite"></div>

<datalist id="einheit-liste">
  <option value="pauschal"><option value="Stk"><option value="m²"><option value="m">
  <option value="lfm"><option value="h"><option value="Tag"><option value="kg"><option value="Pos">
</datalist>

<script>
  // Startprobleme sichtbar machen: Ohne das bliebe die Seite einfach leer,
  // wenn ein Modul nicht lädt (z.B. blockiertes Netz, alter Zwischenspeicher).
  window.startFehler = function (text) {
    var ziel = document.getElementById("app");
    if (!ziel || ziel.dataset.gestartet === "ja") return;
    ziel.innerHTML =
      '<main><div class="karte karte-pad" style="margin:20px auto;max-width:520px">' +
      '<div class="hinweis fehler"><div><b>Die App konnte nicht starten</b>' +
      String(text || "") + "</div></div>" +
      '<div class="btn-reihe" style="margin-top:12px">' +
      '<button class="btn" type="button" onclick="location.reload()">Neu laden</button>' +
      '<button class="btn zweit" type="button" onclick="window.appZuruecksetzen()">Zwischenspeicher leeren</button>' +
      "</div></div></main>";
  };
  // Leert Service-Worker-Cache und Registrierung – hilft nach einem fehlerhaften Stand.
  window.appZuruecksetzen = async function () {
    try {
      if (window.caches) { const n = await caches.keys(); await Promise.all(n.map((x) => caches.delete(x))); }
      if (navigator.serviceWorker) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
    } catch (e) { /* egal */ }
    location.reload();
  };
  window.addEventListener("error", function (e) {
    if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      window.startFehler("Eine Datei der App konnte nicht geladen werden: " + (e.target.src || e.target.href));
    }
  }, true);
  setTimeout(function () {
    window.startFehler("Der Start dauert ungewöhnlich lange. Meist hilft «Zwischenspeicher leeren».");
  }, 8000);
</script>
<script type="module" src="js/app.js"></script>
<script type="module">
  // Läuft nur, wenn Module überhaupt unterstützt werden und app.js geladen hat.
  window.addEventListener("unhandledrejection", (e) => {
    if (document.getElementById("app").dataset.gestartet !== "ja") {
      window.startFehler("Fehler beim Start: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
    }
  });
</script>
<script nomodule>
  window.startFehler("Dieser Browser ist zu alt für die App (keine JavaScript-Module).");
</script>
<script>
  // Service Worker nur für die App-Hülle – macht die App auf dem Handy installierbar.
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
