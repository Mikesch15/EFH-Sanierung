<head>
<meta charset="utf-8">

<body>
<header class="kopf" id="kopf">
  <div class="kopf-inner">
    <div class="marke"><b id="kopf-titel">Tulpenweg 37</b><span id="kopf-unter">Sanierung &amp; Dokumente</span></div>
    <nav class="tabs-desktop" id="nav-desktop"></nav>
  </div>
</header>

<div id="app">
  <main><div class="karte karte-pad" style="margin:20px auto;max-width:520px">
    <div class="leer"><b>App wird geladen …</b>Stand 6 · 19.09.2026</div>
    <noscript><div class="hinweis warn"><div><b>JavaScript ist ausgeschaltet</b>Die App braucht JavaScript.</div></div></noscript>
  </div></main>
</div>

<nav class="tabs-mobil" id="nav-mobil" hidden></nav>
<div id="modal-wrap"></div>
<div id="meldung" aria-live="polite"></div>

<datalist id="einheit-liste">
  <option value="pauschal"><option value="Stk"><option value="m²"><option value="m">
  <option value="lfm"><option value="h"><option value="Tag"><option value="kg"><option value="Pos">
</datalist>

<script>
  // Startprobleme sichtbar machen: Ohne das bliebe die Seite einfach leer,
  // wenn ein Modul nicht lädt (z.B. blockiertes Netz, alter Zwischenspeicher).
  window.startFehler = function (text) {
    var ziel = document.getElementById("app");
    if (!ziel || ziel.dataset.gestartet === "ja" || ziel.dataset.fehler === "ja") return;
    ziel.dataset.fehler = "ja";

    // Erster Fehlversuch: einmal selbst aufräumen und neu laden. Der Marker in
    // der Adresse verhindert eine Endlosschleife, auch ohne Websitedaten.
    if (location.search.indexOf("reparatur=1") === -1) {
      ziel.innerHTML =
        '<main><div class="karte karte-pad" style="margin:20px auto;max-width:520px">' +
        '<div class="hinweis info"><div><b>Start wird wiederholt</b>' +
        "Alte Zwischenstände werden entfernt …</div></div></div></main>";
      window.appZuruecksetzen(true);
      return;
    }

    ziel.innerHTML =
      '<main><div class="karte karte-pad" style="margin:20px auto;max-width:520px">' +
      '<div class="hinweis fehler"><div><b>Die App konnte nicht starten</b>' +
      String(text || "") + "</div></div>" +
      '<div class="btn-reihe" style="margin-top:12px">' +
      '<button class="btn" type="button" onclick="location.reload()">Neu laden</button>' +
      '<a class="btn zweit" href="hilfe.html">Diagnose öffnen</a>' +
      "</div></div></main>";
  };
  // Entfernt Service Worker und Zwischenspeicher – hilft nach einem fehlerhaften Stand.
  window.appZuruecksetzen = async function (mitMarker) {
    try {
      if (window.caches) { var n = await caches.keys(); await Promise.all(n.map(function (x) { return caches.delete(x); })); }
      if (navigator.serviceWorker) {
        var regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(function (r) { return r.unregister(); }));
      }
    } catch (e) { /* egal */ }
    if (mitMarker) {
      location.replace(location.pathname + "?reparatur=1&t=" + Date.now());
    } else {
      location.reload();
    }
  };
  window.addEventListener("error", function (e) {
    if (e.target && (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")) {
      window.startFehler("Eine Datei der App konnte nicht geladen werden:<br><code>" +
        String(e.target.src || e.target.href) + "</code>");
      return;
    }
    // Fehler beim Ausführen – genau den brauchen wir, um die Ursache zu sehen.
    window.startFehler("<code>" + String(e.message || "Unbekannter Fehler") +
      (e.filename ? "<br>" + String(e.filename).split("/").slice(-2).join("/") + ":" + e.lineno : "") +
      "</code>");
  }, true);
  setTimeout(function () {
    window.startFehler("Der Start dauert ungewöhnlich lange. Meist hilft «Zwischenspeicher leeren».");
  }, 8000);
</script>
<script type="module" src="js/app.js"></script>
<script type="module">
  // Läuft nur, wenn Module überhaupt unterstützt werden und app.js geladen hat.
  window.addEventListener("unhandledrejection", (e) => {
    if (document.getElementById("app").dataset.gestartet !== "ja") {
      window.startFehler("Fehler beim Start: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
    }
  });
</script>
<script nomodule>
  window.startFehler("Dieser Browser ist zu alt für die App (keine JavaScript-Module).");
</script>
<script>
  // Service Worker macht die App auf dem Handy installierbar. Er speichert nichts
  // zwischen; updateViaCache "none" sorgt dafür, dass er selbst nie aus dem
  // Browser-Zwischenspeicher kommt, sondern immer frisch geprüft wird.
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
        .then(function (reg) { reg.update(); })
        .catch(function () {});
    });
  }
</script>
</body>
</html>
