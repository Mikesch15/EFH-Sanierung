<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanierungs- und Dokumentenverwaltung</title>
<meta name="description" content="Budget, Offerten, Belege und Dokumente der Sanierung Tulpenweg 37.">
<link rel="stylesheet" href="css/stil.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C2742">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sanierung">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<header class="kopf" id="kopf">
  <div class="kopf-inner">
    <div class="marke"><b id="kopf-titel">Tulpenweg 37</b><span id="kopf-unter">Sanierung &amp; Dokumente</span></div>
    <nav class="tabs-desktop" id="nav-desktop"></nav>
  </div>
</header>

<div id="app"></div>

<nav class="tabs-mobil" id="nav-mobil" hidden></nav>
<div id="modal-wrap"></div>
<div id="meldung" aria-live="polite"></div>

<datalist id="einheit-liste">
  <option value="pauschal"><option value="Stk"><option value="m²"><option value="m">
  <option value="lfm"><option value="h"><option value="Tag"><option value="kg"><option value="Pos">
</datalist>

<script type="module" src="js/app.js"></script>
<script>
  // Service Worker nur für die App-Hülle – macht die App auf dem Handy installierbar.
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
