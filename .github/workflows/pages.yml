# Optionaler Weg: nur den Ordner app/ veröffentlichen, damit die App direkt unter
# https://<benutzername>.github.io/EFH-Sanierung/ liegt statt unter .../app/index.html.
#
# Dieser Workflow läuft NUR auf Knopfdruck (Actions → diesen Workflow → "Run workflow").
# Voraussetzung: Settings → Pages → Source auf "GitHub Actions" umstellen. Solange dort
# "Deploy from a branch" eingestellt ist, veröffentlicht GitHub das Repo selbst – dann
# wird dieser Workflow nicht gebraucht und würde nur fehlschlagen.
name: App auf GitHub Pages veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Nur den Ordner app/ hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
